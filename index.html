<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOTELOK ANIMAL QUANT</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #0f172a; color: #f8fafc; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 480px; }
        h1 { text-align: center; color: #38bdf8; font-size: 1.5rem; margin-bottom: 20px; }
        .card { background-color: #1e293b; padding: 20px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        h2 { font-size: 1.1rem; color: #cbd5e1; margin-top: 0; }
        button { background-color: #0284c7; color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; margin-top: 10px; }
        button:active { background-color: #0369a1; }
        input, select { width: 100%; padding: 10px; margin-top: 8px; margin-bottom: 15px; background-color: #0f172a; border: 1px solid #475569; color: white; border-radius: 6px; box-sizing: border-box; }
        .result-box { margin-top: 15px; padding: 12px; background-color: #0f172a; border-radius: 8px; border-left: 4px solid #38bdf8; display: none; }
        .error { color: #f87171; font-size: 0.9rem; margin-top: 10px; display: none; }
        .success { color: #4ade80; font-size: 0.9rem; margin-top: 10px; display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>SOTELOK ANIMAL QUANT</h1>

        <!-- Tarjeta de Predicción -->
        <div class="card">
            <h2>🎯 Pronóstico Inteligente (Cuantitativo)</h2>
            <button onclick="obtenerPrediccion()">Obtener Predicción</button>
            <div id="error-pred" class="error"></div>
            <div id="resultado-pred" class="result-box"></div>
        </div>

        <!-- Tarjeta de Carga de Datos -->
        <div class="card">
            <h2>📥 Cargar Resultados del Día</h2>
            <label>Fecha:</label>
            <input type="text" id="fecha" placeholder="Ej: 04/11/2026">
            
            <label>Números (separados por coma):</label>
            <input type="text" id="numeros" placeholder="Ej: 5,12,24,36">
            
            <button onclick="guardarResultados()">Guardar en la Base de Datos</button>
            <div id="error-carga" class="error"></div>
            <div id="success-carga" class="success"></div>
        </div>
    </div>

    <script>
        // Poner fecha actual por defecto
        const hoy = new Date();
        const d = String(hoy.getDate()).padStart(2, '0');
        const m = String(hoy.getMonth() + 1).padStart(2, '0');
        const y = hoy.getFullYear();
        document.getElementById('fecha').value = `${d}/${m}/${y}`;

        async function obtenerPrediccion() {
            const errDiv = document.getElementById('error-pred');
            const resDiv = document.getElementById('resultado-pred');
            errDiv.style.display = 'none';
            resDiv.style.display = 'none';

            try {
                const response = await fetch('/api/prediccion');
                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Error al obtener predicción');
                }

                const sf = data.pronostico_cuantitativo.super_fijo;
                const secs = data.pronostico_cuantitativo.secundarios_tripleta;

                resDiv.innerHTML = `
                    <strong>🔥 SUPER FIJO:</strong> ${sf.numero} - ${sf.animal} (Score: ${sf.score})<br><br>
                    <strong>⚡ Secundarios:</strong><br>
                    1. ${secs[0].numero} - ${secs[0].animal} (Score: ${secs[0].score})<br>
                    2. ${secs[1].numero} - ${secs[1].animal} (Score: ${secs[1].score})<br><br>
                    <small>Analizados ${data.total_registros_analizados} registros en total.</small>
                `;
                resDiv.style.display = 'block';
            } catch (err) {
                errDiv.innerText = err.message;
                errDiv.style.display = 'block';
            }
        }

        async function guardarResultados() {
            const fecha = document.getElementById('fecha').value;
            const numerosStr = document.getElementById('numeros').value;
            const errDiv = document.getElementById('error-carga');
            const sucDiv = document.getElementById('success-carga');
            
            errDiv.style.display = 'none';
            sucDiv.style.display = 'none';

            if (!fecha || !numerosStr) {
                errDiv.innerText = "Por favor completa la fecha y los números.";
                errDiv.style.display = 'block';
                return;
            }

            const numeros = numerosStr.split(',').map(n => parseInt(n.trim())).filter(n => !isNaN(n));

            try {
                const response = await fetch('/api/cargar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ fecha, numeros })
                });

                const data = await response.json();
                if (!response.ok) throw new Error(data.error || 'Error al guardar');

                sucDiv.innerText = "¡Resultados guardados con éxito en la base de datos!";
                sucDiv.style.display = 'block';
                document.getElementById('numeros').value = '';
            } catch (err) {
                errDiv.innerText = err.message;
                errDiv.style.display = 'block';
            }
        }
    </script>
</body>
</html>
